[versions]
agp                 = "8.5.2"
kotlin              = "1.9.24"
coreKtx             = "1.13.1"
lifecycle           = "2.8.3"
activityCompose     = "1.9.1"
composeBom          = "2024.06.00"
navigation          = "2.7.7"
hilt                = "2.51.1"
hiltNavigation      = "1.2.0"
firebaseBom         = "33.1.2"
mapsCompose         = "4.4.1"
playServicesMaps    = "19.0.0"
playServicesLoc     = "21.3.0"
coil                = "2.6.0"
coroutines          = "1.8.1"
room                = "2.6.1"
datastore           = "1.1.1"
generativeai        = "0.9.0"
accompanist         = "0.34.0"
serialization       = "1.6.3"

[libraries]
androidx-core-ktx                    = { group = "androidx.core",          name = "core-ktx",                       version.ref = "coreKtx" }
androidx-lifecycle-runtime           = { group = "androidx.lifecycle",      name = "lifecycle-runtime-ktx",          version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",      name = "lifecycle-viewmodel-compose",    version.ref = "lifecycle" }
androidx-activity-compose            = { group = "androidx.activity",       name = "activity-compose",               version.ref = "activityCompose" }

androidx-compose-bom                 = { group = "androidx.compose",        name = "compose-bom",                   version.ref = "composeBom" }
androidx-ui                          = { group = "androidx.compose.ui",     name = "ui" }
androidx-ui-graphics                 = { group = "androidx.compose.ui",     name = "ui-graphics" }
androidx-ui-tooling-preview          = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
androidx-ui-tooling                  = { group = "androidx.compose.ui",     name = "ui-tooling" }
androidx-ui-test-manifest            = { group = "androidx.compose.ui",     name = "ui-test-manifest" }
androidx-ui-test-junit4              = { group = "androidx.compose.ui",     name = "ui-test-junit4" }
androidx-material3                   = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons              = { group = "androidx.compose.material",  name = "material-icons-extended" }

androidx-navigation-compose          = { group = "androidx.navigation",     name = "navigation-compose",             version.ref = "navigation" }

hilt-android                         = { group = "com.google.dagger",       name = "hilt-android",                  version.ref = "hilt" }
hilt-compiler                        = { group = "com.google.dagger",       name = "hilt-android-compiler",         version.ref = "hilt" }
hilt-navigation-compose              = { group = "androidx.hilt",           name = "hilt-navigation-compose",       version.ref = "hiltNavigation" }

firebase-bom                         = { group = "com.google.firebase",     name = "firebase-bom",                  version.ref = "firebaseBom" }
firebase-auth                        = { group = "com.google.firebase",     name = "firebase-auth-ktx" }
firebase-firestore                   = { group = "com.google.firebase",     name = "firebase-firestore-ktx" }
firebase-storage                     = { group = "com.google.firebase",     name = "firebase-storage-ktx" }
firebase-messaging                   = { group = "com.google.firebase",     name = "firebase-messaging-ktx" }
firebase-analytics                   = { group = "com.google.firebase",     name = "firebase-analytics-ktx" }

maps-compose                         = { group = "com.google.maps.android", name = "maps-compose",                  version.ref = "mapsCompose" }
play-services-maps                   = { group = "com.google.android.gms",  name = "play-services-maps",            version.ref = "playServicesMaps" }
play-services-location               = { group = "com.google.android.gms",  name = "play-services-location",        version.ref = "playServicesLoc" }

generativeai                         = { group = "com.google.ai.client.generativeai", name = "generativeai",        version.ref = "generativeai" }

coil-compose                         = { group = "io.coil-kt",              name = "coil-compose",                  version.ref = "coil" }

coroutines-android                   = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-android",    version.ref = "coroutines" }
coroutines-play-services             = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

serialization-json                   = { group = "org.jetbrains.kotlinx",   name = "kotlinx-serialization-json",    version.ref = "serialization" }

room-runtime                         = { group = "androidx.room",           name = "room-runtime",                  version.ref = "room" }
room-ktx                             = { group = "androidx.room",           name = "room-ktx",                      version.ref = "room" }
room-compiler                        = { group = "androidx.room",           name = "room-compiler",                 version.ref = "room" }

datastore-preferences                = { group = "androidx.datastore",      name = "datastore-preferences",         version.ref = "datastore" }

accompanist-permissions              = { group = "com.google.accompanist",  name = "accompanist-permissions",       version.ref = "accompanist" }

junit                                = { group = "junit",                   name = "junit",                         version = "4.13.2" }
androidx-junit                       = { group = "androidx.test.ext",       name = "junit",                         version = "1.2.1" }
androidx-espresso                    = { group = "androidx.test.espresso",  name = "espresso-core",                 version = "3.6.1" }

[plugins]
android-application   = { id = "com.android.application",                        version.ref = "agp" }
kotlin-android        = { id = "org.jetbrains.kotlin.android",                    version.ref = "kotlin" }
google-services       = { id = "com.google.gms.google-services",                 version = "4.4.2" }
hilt                  = { id = "com.google.dagger.hilt.android",                  version.ref = "hilt" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization",      version.ref = "kotlin" }
kotlin-kapt           = { id = "org.jetbrains.kotlin.kapt",                      version.ref = "kotlin" }